<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuReo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#login-screen, #dashboard { display: none; flex-direction: column; padding: 20px; height: 100%; }
.active { display: flex !important; }
h2 { text-align: center; margin-bottom: 20px; color: #4cc9f0; }
input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #161b22; color: #fff; font-size: 16px; }
button { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 18px; font-weight: bold; color: #fff; background: #0d6efd; cursor: pointer; transition: 0.2s; }
button:active { transform: scale(0.98); }
button:disabled { background: #444; cursor: not-allowed; }
#error-msg { color: #ff4d4d; text-align: center; margin-top: 10px; display: none; }
#overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
.spinner { width: 50px; height: 50px; border: 5px solid #333; border-top-color: #4cc9f0; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#log { flex: 1; background: #000; color: #0f0; padding: 10px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; border-radius: 8px; margin-bottom: 10px; }
.btn-row { display: flex; gap: 10px; }
.btn-row button { flex: 1; }
.btn-danger { background: #dc3545; }
.btn-success { background: #198754; }
#dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.badge { background: #0d6efd; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
</style>
</head>
<body>

<div id="overlay"><div class="spinner"></div><p style="margin-top:15px; font-size:18px; color:#4cc9f0;">جاري التحميل...</p></div>

<div id="login-screen" class="active">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="student_id" placeholder="رقم الطالب (ID)">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button id="login-btn" onclick="doLogin()">دخول للمنصة</button>
    <div id="error-msg"></div>
</div>

<div id="dashboard">
    <div id="dashboard-header">
        <span>مرحباً، <b id="user-name">...</b></span>
        <span class="badge">💎 <span id="diamonds">0</span></span>
    </div>
    <div id="log"></div>
    <div class="btn-row">
        <button id="start-btn" class="btn-success" onclick="startSolving('perfect')">حل المراحل</button>
        <button id="cancel-btn" class="btn-danger" onclick="cancelSolving()" disabled>إلغاء</button>
    </div>
    <button style="margin-top:10px; background:#6c757d;" onclick="logout()">تسجيل خروج</button>
</div>

<script>
const BASE = "https://me-tp.qureo.education";
const PORTAL = "https://me-portal.qureo.education";
let isRunning = false;
let currentCookies = "";
let logIndex = 0;
let logs = [];

function log(msg, type="info") {
    let color = type === "error" ? "#ff4d4d" : type === "success" ? "#0f0" : type === "header" ? "#4cc9f0" : "#fff";
    let span = document.createElement("div");
    span.style.color = color;
    span.innerText = msg;
    document.getElementById("log").appendChild(span);
    document.getElementById("log").scrollTop = document.getElementById("log").scrollHeight;
}

function showError(msg) {
    let e = document.getElementById("error-msg");
    e.innerText = msg; e.style.display = "block";
}

function showOverlay(show) {
    document.getElementById("overlay").style.display = show ? "flex" : "none";
}

async function api(method, url, body) {
    if (url.startsWith("/api")) url = BASE + url;
    let bodyStr = body ? JSON.stringify(body) : null;
    let resStr = AndroidBridge.request(method, url, bodyStr);
    try {
        let parsed = JSON.parse(resStr);
        if (parsed.status === 302 || parsed.status === 401) return null; // Unauthorized
        if (parsed.status === 200) return parsed.body; // Return string to parse later
        return { error: parsed.body };
    } catch(e) { return { error: e.message }; }
}

async function doLogin() {
    let sid = document.getElementById("student_id").value.trim();
    let pwd = document.getElementById("password").value.trim();
    if (!sid || !pwd) return showError("الرجاء إدخال البيانات");

    document.getElementById("login-btn").disabled = true;
    document.getElementById("error-msg").style.display = "none";
    showOverlay(true);

    try {
        // Login Request to Portal
        let loginResStr = AndroidBridge.request("POST", PORTAL + "/oauth2/password-login", JSON.stringify({student_id: sid, password: pwd}));
        let loginRes = JSON.parse(loginResStr);
        
        if (loginRes.status === 200 || loginRes.status === 302) {
            // Save cookies
            currentCookies = AndroidBridge.getLastCookies();
            AndroidBridge.setCookies(currentCookies);
            
            // Verify
            let verifyStr = AndroidBridge.request("GET", BASE + "/api/study/students/me", null);
            let verify = JSON.parse(verifyStr);
            
            if (verify.status === 200) {
                let me = JSON.parse(verify.body);
                document.getElementById("user-name").innerText = me.name || "Student";
                
                // Fetch diamonds
                let dStr = AndroidBridge.request("GET", BASE + "/api/study/students/courses/javascript_ar/diamond", null);
                let d = JSON.parse(dStr);
                if (d.status === 200) document.getElementById("diamonds").innerText = JSON.parse(d.body);
                
                document.getElementById("login-screen").classList.remove("active");
                document.getElementById("dashboard").classList.add("active");
                log("✅ تم تسجيل الدخول بنجاح!", "success");
            } else {
                showError("فشل التحقق من الصلاحيات (HTTP " + verify.status + ")");
            }
        } else {
            showError("بيانات مرفوضة. تأكد من الـ ID والباسورد.");
        }
    } catch(e) {
        showError("خطأ في الاتصال: " + e.message);
    } finally {
        showOverlay(false);
        document.getElementById("login-btn").disabled = false;
    }
}

async function startSolving(mode) {
    if (isRunning) return;
    isRunning = true;
    document.getElementById("start-btn").disabled = true;
    document.getElementById("cancel-btn").disabled = false;
    document.getElementById("log").innerHTML = "";
    
    log("🚀 بدء الحل...", "header");
    try {
        // Fetch progress
        let cStr = AndroidBridge.request("GET", BASE + "/api/study/students/sections/5/chapters", null);
        let c = JSON.parse(cStr);
        let progressMap = {};
        if (c.status === 200) {
            let arr = JSON.parse(c.body);
            arr.forEach(item => progressMap[item.chapter_id] = item);
        }
        
        let chapsStr = AndroidBridge.request("GET", BASE + "/api/study/sections/5", null);
        let chaps = JSON.parse(chapsStr);
        let qMap = {};
        if (chaps.status === 200) {
            let chObj = JSON.parse(chaps.body);
            if (chObj.chapters) chObj.chapters.forEach(ch => qMap[ch.id] = ch.question_count || 5);
        }

        let targets = [];
        for (let i = 1; i <= 42; i++) {
            let chapId = 90000 + i;
            let info = progressMap[chapId] || {};
            let score = info.best_correct_count || 0;
            let qCount = qMap[chapId] || 5;
            
            if (mode === 'perfect') {
                if (score < qCount) targets.push({id: chapId, num: i});
            } else {
                targets.push({id: chapId, num: i});
            }
        }
        
        if (targets.length === 0) {
            log("🎉 كل المراحل مكتملة بالفعل!", "success");
            return;
        }
        
        log(`🚀 جاري حل ${targets.length} مرحلة...`, "header");
        for (let t of targets) {
            if (!isRunning) break;
            log(`\n========== المرحلة ${t.num} ==========`, "header");
            await solveChapter(t.id);
        }
        
        if (isRunning) log("🎉🎉🎉 انتهى!", "done");
        
    } catch(e) {
        log("❌ خطأ: " + e.message, "error");
    } finally {
        isRunning = false;
        document.getElementById("start-btn").disabled = false;
        document.getElementById("cancel-btn").disabled = true;
    }
}

function cancelSolving() {
    isRunning = false;
    log("⏹️ تم إلغاء العملية.", "warn");
}

async function solveChapter(chapId) {
    if (!isRunning) return;
    let rStr = AndroidBridge.request("GET", BASE + "/api/study/chapters/" + chapId, null);
    let r = JSON.parse(rStr);
    if (r.status !== 200) { log("فشل جلب الفصل", "error"); return; }
    
    let data = JSON.parse(r.body);
    let lectures = data.lectures || [];
    let testType = (data.chapter && data.chapter.test_type) || "test";
    
    for (let lec of lectures) {
        if (!isRunning) return;
        let lecId = lec.id;
        log(`▶ بدء الدرس: ${lec.title}`, "header");
        AndroidBridge.request("PUT", BASE + "/api/study/students/lectures/" + lecId, null);
        await sleep(200);
        
        let lrStr = AndroidBridge.request("GET", BASE + "/api/study/lectures/" + lecId, null);
        let lr = JSON.parse(lrStr);
        if (lr.status === 200) {
            let lrData = JSON.parse(lr.body);
            for (let t of lrData.talks || []) {
                if (t.type === 'try') {
                    let tryData = (t.body && t.body.codes && t.body.codes[0]) || {};
                    if (tryData.model_answer) {
                        AndroidBridge.request("PUT", BASE + "/api/study/students/lecture-talks/" + t.id, JSON.stringify({value: {try: {lang: tryData.lang || 'javascript', answer: tryData.model_answer}}}));
                        await sleep(200);
                    }
                }
            }
        }
        AndroidBridge.request("PUT", BASE + "/api/study/students/lectures/" + lecId + "/complete", null);
        log(`  ✅ تم إنهاء الدرس`, "success");
        await sleep(200);
    }
    
    if (!isRunning) return;
    log("جلب الأسئلة...", "info");
    let qStr = AndroidBridge.request("GET", BASE + "/api/study/chapters/" + chapId + "/test", null);
    let q = JSON.parse(qStr);
    if (q.status !== 200) { log("فشل جلب الأسئلة", "error"); return; }
    
    let questions = [];
    let qData = JSON.parse(q.body);
    if (Array.isArray(qData)) {
        for (let item of qData) if (item.question && item.question.id) questions.push({id: item.question.id, type: item.question.type});
    }
    if (questions.length === 0) { log("لا أسئلة", "warn"); return; }
    
    await solveTwoPass(chapId, questions, testType);
}

async function solveTwoPass(chapId, questions, testType) {
    let total = questions.length;
    let prefix = testType === "test" ? "test" : "review";
    let ep = "/api/study/students/" + prefix + "-questions";
    
    log(`🔵 PASS 1/2: إرسال إجابات مبدئية (${total} سؤال)...`, "header");
    AndroidBridge.request("DELETE", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
    AndroidBridge.request("PUT", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
    await sleep(500);
    
    for (let item of questions) {
        if (!isRunning) return;
        if (item.type === "choice") AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/choice", JSON.stringify({choice_id: parseInt(item.id + "1")}));
        else AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/description", JSON.stringify({answer_code: "let _x=0;"}));
        log(`  Q${item.id} — sent dummy`, "info");
        await sleep(200);
    }
    await sleep(1000);
    
    log("جلب الإجابات الصحيحة...", "info");
    let r1Str = AndroidBridge.request("GET", BASE + "/api/study/students/chapters/" + chapId + "/" + prefix + "/result", null);
    let answers = {};
    let r1 = JSON.parse(r1Str);
    if (r1.status === 200) {
        let res = JSON.parse(r1.body).result || {};
        for (let cr of res.choice_results || []) {
            let correct = (cr.choices || []).find(c => c.correct);
            if (cr.question_id && correct && correct.choice) answers[cr.question_id] = {choice_id: correct.choice.id};
        }
        for (let dr of res.description_results || []) {
            if (dr.question_id && dr.model_answer) answers[dr.question_id] = {answer_code: dr.model_answer};
        }
    }
    
    log(`🟢 PASS 2/2: إعادة الجلسة بالإجابات الصحيحة...`, "header");
    AndroidBridge.request("DELETE", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
    AndroidBridge.request("PUT", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
    await sleep(500);
    
    for (let item of questions) {
        if (!isRunning) return;
        if (answers[item.id]) {
            let ans = answers[item.id];
            if (item.type === "choice") AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/choice", JSON.stringify(ans));
            else AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/description", JSON.stringify(ans));
            log(`  Q${item.id} ✅`, "success");
        } else log(`  Q${item.id} ❌`, "error");
        await sleep(200);
    }
    await sleep(1000);
    
    let rfStr = AndroidBridge.request("GET", BASE + "/api/study/students/chapters/" + chapId + "/" + prefix + "/result", null);
    let rf = JSON.parse(rfStr);
    let score = 0;
    if (rf.status === 200) score = (JSON.parse(rf.body).result || {}).correct_count || 0;
    log(`🎉 النتيجة: ${score}/${total}`, score === total ? "success" : "warn");
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function logout() { location.reload(); }
</script>
</body>
</html>
