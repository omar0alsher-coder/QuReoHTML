<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mohamed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* شيلنا الـ padding-top خالص عشان الخط الأسود يختفي */
        body { font-family: 'Cairo', sans-serif; background: #09090b; color: #f8fafc; overflow-x: hidden; margin: 0; padding: 0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .chapter-card { transition: all 0.3s ease; cursor: pointer; }
        .chapter-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); z-index: 10; }
        #logTerminal { font-family: monospace; direction: ltr; text-align: left; font-size: 13px; line-height: 1.6; }
        #logTerminal div { border-bottom: 1px solid #1e293b; padding: 2px 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .log-header { color: #c084fc; font-weight: bold; margin-top: 8px; border-top: 1px solid #334155; padding-top: 5px; }
        .log-info { color: #60a5fa; }
        .log-q { color: #fbbf24; }
        .log-a { color: #34d399; }
        .log-success { color: #10b981; font-weight: bold; }
        .log-error { color: #f87171; font-weight: bold; }
        .log-warn { color: #facc15; }
        
        /* إضافة مسافة أمان للهيدر بس عشان ميبقاش تحت الكاميرا */
        header { padding-top: env(safe-area-inset-top); }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen"></div>
    <script>
        function initIcons() { if(typeof lucide !== 'undefined') lucide.createIcons(); }
        const app = document.getElementById('app');
        let chaptersData = [];
        let isRunning = false;

        const BASE = "https://me-tp.qureo.education";
        const PORTAL = "https://me-portal.qureo.education";

        function safeParse(s) { try { return JSON.parse(s); } catch(e) { return null; } }
        
        // سرعة قصوى (10ms)
        function sleep(ms) { return new Promise(r => setTimeout(r, Math.max(10, ms / 10))); }
        
        function cleanText(text) {
            if (!text) return "";
            return text.replace(/\[\[bdi\]\]|\[\[\/bdi\]\]|\[\[bold\]\]|\[\[\/bold\]\]|\[\[code\]\]|\[\[\/code\]\]/g, "").replace(/\n/g, " ").trim();
        }

        function renderLogin(errorMsg = '') {
            app.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full blur-[120px] opacity-30"></div>
                    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600 rounded-full blur-[120px] opacity-30"></div>
                    <div class="glass w-full max-w-md p-8 rounded-2xl relative z-10">
                        <div class="flex flex-col items-center mb-6">
                            <div class="w-16 h-16 bg-blue-500/20 rounded-2xl flex items-center justify-center mb-4 glow">
                                <i data-lucide="shield" class="w-8 h-8 text-blue-400"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-white mb-1">Mohamed</h1>
                            <p class="text-slate-400 text-sm">أفضل أداة لحل المراحل بضمان 100%</p>
                        </div>
                        ${errorMsg ? `<div class="bg-red-500/10 border border-red-500/50 text-red-400 p-2 rounded-lg mb-4 text-sm text-center">${errorMsg}</div>` : ''}
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">رقم الطالب (ID)</label>
                                <div class="relative">
                                    <i data-lucide="user" class="absolute right-3 top-3 w-5 h-5 text-slate-500"></i>
                                    <input type="text" id="studentId" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-2.5 pr-10 pl-4 text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="477650905" />
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">كلمة المرور</label>
                                <div class="relative">
                                    <i data-lucide="key" class="absolute right-3 top-3 w-5 h-5 text-slate-500"></i>
                                    <input type="password" id="password" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-2.5 pr-10 pl-4 text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="********" />
                                </div>
                            </div>
                            <button id="loginBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl transition-all flex justify-center items-center gap-2 mt-4">
                                <span>دخول للمنصة</span>
                                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            initIcons();
            document.getElementById('loginBtn').addEventListener('click', async () => {
                const sid = document.getElementById('studentId').value.trim();
                const pwd = document.getElementById('password').value.trim();
                if(!sid || !pwd) { renderLogin("الرجاء إدخال رقم الطالب وكلمة المرور"); return; }
                const btn = document.getElementById('loginBtn');
                btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>جاري الدخول...</span>`;
                initIcons();
                
                AndroidBridge.clearCookies();
                await sleep(100);

                let loginRes = safeParse(AndroidBridge.request("POST", PORTAL + "/oauth2/password-login", JSON.stringify({student_id: sid, password: pwd})));
                if (!loginRes || (loginRes.status !== 200 && loginRes.status !== 302)) {
                    renderLogin("بيانات مرفوضة (HTTP " + (loginRes ? loginRes.status : "?") + ")");
                    return;
                }

                AndroidBridge.setCookie("student_selected_content_id", "javascript_ar");

                let verify = safeParse(AndroidBridge.request("GET", BASE + "/api/study/students/me", null));
                if (!verify || verify.status !== 200) {
                    renderLogin("فشل التحقق (HTTP " + (verify ? verify.status : "?") + ")");
                    return;
                }
                
                await fetchDataAndRender();
            });
        }

        async function fetchDataAndRender() {
            let me = safeParse(safeParse(AndroidBridge.request("GET", BASE + "/api/study/students/me", null)).body);
            let d = safeParse(AndroidBridge.request("GET", BASE + "/api/study/students/courses/javascript_ar/diamond", null));
            let totalDiamonds = (d && d.status === 200) ? safeParse(d.body) : 0;

            let c = safeParse(AndroidBridge.request("GET", BASE + "/api/study/students/sections/5/chapters", null));
            let progressMap = {};
            if (c && c.status === 200) {
                let arr = safeParse(c.body);
                if(Array.isArray(arr)) arr.forEach(item => progressMap[item.chapter_id] = item);
            }

            let chaps = safeParse(AndroidBridge.request("GET", BASE + "/api/study/sections/5", null));
            let qMap = {};
            if (chaps && chaps.status === 200) {
                let chObj = safeParse(chaps.body);
                if (chObj.chapters) chObj.chapters.forEach(ch => qMap[ch.id] = ch.question_count || 5);
            }

            chaptersData = [];
            for (let i = 1; i <= 42; i++) {
                let chapId = 90000 + i;
                let info = progressMap[chapId] || {};
                let score = info.best_correct_count || 0;
                let qCount = qMap[chapId] || 5;
                let badge = "RETRY";
                if (score === qCount && qCount > 0) badge = "PERFECT";
                else if (score > 0) badge = "CLEAR";

                chaptersData.push({
                    id: chapId, num: i, completed: "completed_at" in info,
                    score: score, total_q: qCount, diamond: info.diamond || 0, badge: badge
                });
            }

            renderDashboard({ user_id: me.id, name: me.name || "Student", total_diamonds: totalDiamonds });
        }

        function renderDashboard(userData) {
            app.innerHTML = `
                <div class="min-h-screen pb-20">
                    <header class="glass sticky top-0 z-40 border-b border-slate-800">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center">
                                    <i data-lucide="sparkles" class="w-5 h-5 text-blue-400"></i>
                                </div>
                                <div>
                                    <h1 class="text-lg font-bold text-white">Mohamed</h1>
                                    <p class="text-xs text-slate-400">${userData.name}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="flex items-center gap-2 bg-slate-800/50 px-3 py-1.5 rounded-xl border border-slate-700">
                                    <span class="text-sm font-bold text-slate-300">الجواهر</span>
                                    <span class="text-lg font-black text-blue-400" id="totalDiamonds">${userData.total_diamonds}</span>
                                    <i data-lucide="diamond" class="w-4 h-4 text-blue-400 fill-current"></i>
                                </div>
                                <button id="logoutBtn" class="p-2 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-colors" title="تسجيل خروج">
                                    <i data-lucide="log-out" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </header>
                    <main class="max-w-7xl mx-auto px-4 mt-6">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-6">
                            <div>
                                <h2 class="text-2xl font-bold text-white mb-1">المراحل</h2>
                                <p class="text-sm text-slate-400">أكمل جميع المراحل (1 - 42) بضمان 100%</p>
                            </div>
                            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                                <button id="toggleLogsBtn" class="flex-1 md:flex-none px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl border border-slate-700 flex items-center justify-center gap-2 text-sm">
                                    <i data-lucide="terminal" class="w-4 h-4"></i> <span>السجل</span>
                                </button>
                                <button id="makePerfectBtn" class="flex-1 md:flex-none px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-xl shadow-lg shadow-purple-900/20 flex items-center justify-center gap-2 text-sm">
                                    <i data-lucide="crown" class="w-4 h-4"></i> <span>اجعل الكل PERFECT</span>
                                </button>
                                <button id="solveAllBtn" class="flex-1 md:flex-none px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-900/20 flex items-center justify-center gap-2 text-sm">
                                    <i data-lucide="play" class="w-4 h-4 fill-current"></i> <span>حل الكل (1-42)</span>
                                </button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3" id="chaptersGrid"></div>
                    </main>
                    <div id="logsContainer" class="fixed bottom-0 left-0 right-0 h-[60vh] bg-[#0a0a0a] border-t border-slate-700 z-50 flex-col shadow-2xl hidden">
                        <div class="flex justify-between items-center px-4 py-2 bg-slate-900 border-b border-slate-800">
                            <div class="flex items-center gap-2 text-sm text-slate-300 font-mono">
                                <i data-lucide="terminal" class="w-4 h-4 text-emerald-400"></i>
                                <span>Live Logs</span>
                            </div>
                            <button id="closeLogsBtn" class="text-slate-400 hover:text-white text-2xl">&times;</button>
                        </div>
                        <div id="logTerminal" class="flex-1 p-4 overflow-y-auto text-sm"></div>
                    </div>
                </div>
            `;
            initIcons();

            const grid = document.getElementById('chaptersGrid');
            chaptersData.forEach(c => {
                let badgeHtml = '';
                if (c.badge === 'PERFECT') badgeHtml = `<span class="text-[10px] font-black text-emerald-400 bg-emerald-400/10 px-1.5 py-0.5 rounded border border-emerald-400/20">PERFECT</span>`;
                else if (c.badge === 'CLEAR') badgeHtml = `<span class="text-[10px] font-black text-blue-400 bg-blue-400/10 px-1.5 py-0.5 rounded border border-blue-400/20">CLEAR</span>`;
                else badgeHtml = `<span class="text-[10px] font-black text-rose-400 bg-rose-400/10 px-1.5 py-0.5 rounded border border-rose-400/20">RETRY</span>`;

                let div = document.createElement('div');
                div.className = `chapter-card glass rounded-xl p-3 flex flex-col relative overflow-hidden group border-t-4 ${c.badge === 'PERFECT' ? 'border-t-emerald-500' : (c.badge === 'CLEAR' ? 'border-t-blue-500' : 'border-t-slate-600')}`;
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-xs font-bold text-slate-400">مرحلة ${c.num}</span>
                        ${badgeHtml}
                    </div>
                    <div class="flex items-center justify-center py-2">
                        ${c.badge === 'PERFECT' ? `
                            <div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i data-lucide="crown" class="w-5 h-5 text-emerald-400"></i>
                            </div>
                        ` : `
                            <div class="w-10 h-10 rounded-full bg-slate-700/50 flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i data-lucide="play" class="w-4 h-4 text-slate-400 fill-current"></i>
                            </div>
                        `}
                    </div>
                    <div class="flex justify-between items-center mt-auto pt-1 border-t border-slate-700/50">
                        <div class="flex items-center gap-1 text-xs text-slate-400">
                            <i data-lucide="book-open" class="w-3 h-3"></i> <span>${c.score}/${c.total_q}</span>
                        </div>
                        <div class="flex items-center gap-1 text-xs font-bold text-blue-400">
                            <span>${c.diamond}</span> <i data-lucide="diamond" class="w-3 h-3 fill-current"></i>
                        </div>
                    </div>
                `;
                div.addEventListener('click', () => {
                    if (isRunning) return;
                    startSolving('single', c.id, c.num);
                });
                grid.appendChild(div);
            });
            initIcons();

            document.getElementById('logoutBtn').addEventListener('click', () => {
                AndroidBridge.clearCookies();
                renderLogin();
            });

            const logsContainer = document.getElementById('logsContainer');
            document.getElementById('toggleLogsBtn').addEventListener('click', () => {
                logsContainer.classList.toggle('hidden');
                logsContainer.classList.toggle('flex');
            });
            document.getElementById('closeLogsBtn').addEventListener('click', () => {
                logsContainer.classList.add('hidden');
                logsContainer.classList.remove('flex');
            });

            // شيلنا الـ confirm عشان يشتغل فوراً من غير ما يعلق
            document.getElementById('makePerfectBtn').addEventListener('click', () => {
                if (isRunning) return;
                startSolving('perfect');
            });

            document.getElementById('solveAllBtn').addEventListener('click', () => {
                if (isRunning) return;
                startSolving('all');
            });
        }

        function appendLog(msg, type="info") {
            let terminal = document.getElementById('logTerminal');
            if(!terminal) return;
            let p = document.createElement('div');
            p.className = `log-${type}`;
            p.innerText = msg;
            terminal.appendChild(p);
            if (terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 100) {
                terminal.scrollTop = terminal.scrollHeight;
            }
        }

        async function startSolving(mode, singleId = null, singleNum = null) {
            if (isRunning) return;
            isRunning = true;
            AndroidBridge.startBackgroundService();
            
            // فتح شاشة السجل أوتوماتيكياً في كل الحالات
            const logsContainer = document.getElementById('logsContainer');
            logsContainer.classList.remove('hidden');
            logsContainer.classList.add('flex');

            let targets = [];
            if (mode === 'single') {
                targets.push({ id: singleId, num: singleNum });
            } else {
                for (let c of chaptersData) {
                    if (mode === 'all' || (mode === 'perfect' && c.badge !== 'PERFECT')) {
                        targets.push(c);
                    }
                }
            }

            if (targets.length === 0) {
                appendLog("🎉 كل المراحل PERFECT بالفعل!", "success");
                isRunning = false;
                AndroidBridge.stopBackgroundService();
                return;
            }

            appendLog(`🚀 بدء حل ${targets.length} مرحلة...`, "header");

            try {
                for (let t of targets) {
                    if (!isRunning) break;
                    appendLog(`\n========== المرحلة ${t.num} ==========`, "header");
                    await solveChapter(t.id);
                    await sleep(500);
                    await fetchDataAndRender();
                }
                if (isRunning) appendLog("🎉🎉🎉 انتهى!", "success");
            } catch(e) {
                appendLog("❌ خطأ: " + e.message, "error");
            } finally {
                isRunning = false;
                AndroidBridge.stopBackgroundService();
            }
        }

        async function solveChapter(chapId) {
            if (!isRunning) return;
            let r = safeParse(AndroidBridge.request("GET", BASE + "/api/study/chapters/" + chapId, null));
            if (!r || r.status !== 200) { appendLog("فشل جلب الفصل", "error"); return; }

            let data = safeParse(r.body) || {};
            let lectures = data.lectures || [];
            let testType = (data.chapter && data.chapter.test_type) || "test";

            for (let lec of lectures) {
                if (!isRunning) return;
                let lecId = lec.id;
                appendLog("▶ بدء الدرس: " + lecId, "header");
                AndroidBridge.request("PUT", BASE + "/api/study/students/lectures/" + lecId, null);
                await sleep(100);

                let lr = safeParse(AndroidBridge.request("GET", BASE + "/api/study/lectures/" + lecId, null));
                if (lr && lr.status === 200) {
                    let lrData = safeParse(lr.body) || {};
                    for (let t of (lrData.talks || [])) {
                        if (t.type === 'try') {
                            let tryData = (t.body && t.body.codes && t.body.codes[0]) || {};
                            let ans = tryData.model_answer;
                            let lang = tryData.lang || 'javascript';
                            if (ans) {
                                appendLog("  Q: " + cleanText(t.body?.question?.text).substring(0, 40) + "...", "q");
                                appendLog("  A: " + ans.substring(0, 40) + "...", "a");
                                AndroidBridge.request("PUT", BASE + "/api/study/students/lecture-talks/" + t.id, JSON.stringify({value: {try: {lang: lang, answer: ans}}}));
                                await sleep(100);
                            }
                        }
                    }
                }
                AndroidBridge.request("PUT", BASE + "/api/study/students/lectures/" + lecId + "/complete", null);
                appendLog("  ✅ تم إنهاء الدرس", "success");
                await sleep(100);
            }

            if (lectures.length > 0) {
                appendLog("انتظار سريع عشان السيرفر يحدث...", "info");
                await sleep(500);
            }
            if (!isRunning) return;

            appendLog("جلب الأسئلة...", "info");
            let q = safeParse(AndroidBridge.request("GET", BASE + "/api/study/chapters/" + chapId + "/test", null));
            if (!q || q.status !== 200) { appendLog("فشل جلب الأسئلة", "error"); return; }

            let questions = [];
            let qData = safeParse(q.body);
            if (Array.isArray(qData)) {
                for (let item of qData) {
                    if (item.question && item.question.id) {
                        questions.push({ id: item.question.id, type: item.question.type });
                    }
                }
            }
            if (questions.length === 0) { appendLog("لا أسئلة", "warn"); return; }

            await solveTwoPass(chapId, questions, testType);
        }

        async function solveTwoPass(chapId, questions, testType) {
            let total = questions.length;
            let prefix = testType === "test" ? "test" : "review";
            let ep = "/api/study/students/" + prefix + "-questions";
            let answers = {};

            appendLog("🔵 PASS 1/2: إرسال إجابات مبدئية (" + total + " سؤال)...", "header");
            AndroidBridge.request("DELETE", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
            AndroidBridge.request("PUT", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
            await sleep(500);

            for (let idx = 0; idx < questions.length; idx++) {
                if (!isRunning) return;
                let item = questions[idx];
                if (item.type === "choice") {
                    let dummyChoice = parseInt(item.id + "1");
                    AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/choice", JSON.stringify({choice_id: dummyChoice}));
                } else {
                    AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/description", JSON.stringify({answer_code: "let _x = 0;"}));
                }
                appendLog("  [" + (idx + 1) + "/" + total + "] Q" + item.id + " — sent dummy", "info");
                await sleep(100);
            }
            await sleep(500);

            appendLog("جلب الإجابات الصحيحة من السيرفر...", "info");
            let r1 = safeParse(AndroidBridge.request("GET", BASE + "/api/study/students/chapters/" + chapId + "/" + prefix + "/result", null));
            if (r1 && r1.status === 200) {
                let res = safeParse(r1.body).result || safeParse(r1.body);
                for (let cr of (res.choice_results || [])) {
                    let correct = (cr.choices || []).find(c => c.correct === true || c.is_correct === true);
                    if (cr.question_id && correct && correct.choice) answers[cr.question_id] = { choice_id: correct.choice.id, text: correct.choice.content };
                }
                for (let dr of (res.description_results || [])) {
                    if (dr.question_id && dr.model_answer) answers[dr.question_id] = { answer_code: dr.model_answer };
                }
            }

            appendLog("🟢 PASS 2/2: إعادة الجلسة بالإجابات الصحيحة...", "header");
            await sleep(500);
            AndroidBridge.request("DELETE", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
            AndroidBridge.request("PUT", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
            await sleep(500);

            let solved = 0;
            for (let idx = 0; idx < questions.length; idx++) {
                if (!isRunning) return;
                let item = questions[idx];
                if (answers[item.id]) {
                    let ans = answers[item.id];
                    if (item.type === "choice") {
                        appendLog("  [" + (idx + 1) + "/" + total + "] Q" + item.id + " ✅ إرسال: " + cleanText(ans.text || "").substring(0, 30), "success");
                        let r = safeParse(AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/choice", JSON.stringify({choice_id: ans.choice_id})));
                        if (r && r.status === 200) solved++;
                    } else {
                        appendLog("  [" + (idx + 1) + "/" + total + "] Q" + item.id + " ✅ إرسال الكود", "success");
                        let r = safeParse(AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/description", JSON.stringify({answer_code: ans.answer_code})));
                        if (r && r.status === 200) solved++;
                    }
                } else {
                    appendLog("  [" + (idx + 1) + "/" + total + "] Q" + item.id + " ❌ بدون إجابة", "error");
                }
                await sleep(100);
            }
            
            appendLog("التحقق من النتيجة النهائية...", "info");
            await sleep(500);
            let rf = safeParse(AndroidBridge.request("GET", BASE + "/api/study/students/chapters/" + chapId + "/" + prefix + "/result", null));
            let score = 0;
            if (rf && rf.status === 200) {
                let res = safeParse(rf.body).result || safeParse(rf.body);
                score = res.correct_count || 0;
            }
            appendLog("🎉 النتيجة النهائية: " + score + "/" + total, score === total ? "success" : "error");
        }

        renderLogin();
    </script>
</body>
</html>
