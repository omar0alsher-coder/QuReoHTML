<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qureo Premium</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background: #0b101e; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#login-screen, #dashboard { display: none; flex-direction: column; padding: 30px 20px; height: 100%; justify-content: center; }
.active { display: flex !important; }
.card { background: rgba(20, 28, 48, 0.9); border: 1px solid #1f2b45; border-radius: 20px; padding: 30px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
.logo { width: 80px; height: 80px; background: #1a253d; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
.logo svg { width: 40px; height: 40px; fill: #4cc9f0; }
h2 { color: #fff; margin-bottom: 5px; font-size: 24px; }
p.subtitle { color: #8b9eb0; font-size: 14px; margin-bottom: 25px; }
.input-group { text-align: right; margin-bottom: 15px; }
.input-group label { font-size: 14px; color: #a0aec0; margin-bottom: 8px; display: block; }
.input-wrapper { position: relative; }
.input-wrapper svg { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: #4cc9f0; opacity: 0.6; }
input { width: 100%; padding: 14px 45px 14px 15px; border-radius: 12px; border: 1px solid #2a3752; background: #121a2b; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
input:focus { border-color: #4cc9f0; box-shadow: 0 0 10px rgba(76,201,240,0.2); }
button { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; color: #fff; background: linear-gradient(135deg, #2563eb, #4f46e5); cursor: pointer; transition: 0.3s; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
button:active { transform: scale(0.97); }
button:disabled { background: #2a3752; color: #8b9eb0; cursor: not-allowed; transform: none; }
#error-msg { color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 14px; display: none; text-align: center; word-break: break-all; }
#dashboard { justify-content: flex-start; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; background: #121a2b; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #1f2b45; }
#log { flex: 1; background: #000; color: #0f0; padding: 10px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; border-radius: 12px; margin-bottom: 15px; border: 1px solid #1f2b45; }
.btn-row { display: flex; gap: 10px; }
.btn-row button { flex: 1; margin-top: 0; }
.btn-danger { background: linear-gradient(135deg, #dc2626, #b91c1c); }
.btn-success { background: linear-gradient(135deg, #10b981, #059669); }
.btn-spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login-screen" class="active">
    <div class="card">
        <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg></div>
        <h2>Qureo Premium</h2>
        <p class="subtitle">أفضل أداة لحل المراحل بضمان 100%</p>
        <div class="input-group">
            <label>رقم الطالب (ID)</label>
            <div class="input-wrapper">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <input type="text" id="student_id" placeholder="أدخل رقم الطالب">
            </div>
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <div class="input-wrapper">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
                <input type="password" id="password" placeholder="••••••••">
            </div>
        </div>
        <button id="login-btn" onclick="doLogin()">
            <span id="btn-text">دخول للمنصة ←</span>
            <div id="btn-spinner" class="btn-spinner"></div>
        </button>
        <div id="error-msg"></div>
    </div>
</div>

<div id="dashboard">
    <div class="header">
        <div>مرحباً، <b id="user-name" style="color:#4cc9f0;">...</b></div>
        <div style="background:#1f2b45; padding:5px 12px; border-radius:20px; font-size:14px;">💎 <span id="diamonds">0</span></div>
    </div>
    <div id="log"></div>
    <div class="btn-row">
        <button id="start-btn" class="btn-success" onclick="startSolving('perfect')">بدء الحل</button>
        <button id="cancel-btn" class="btn-danger" onclick="cancelSolving()" disabled>إلغاء</button>
    </div>
    <button style="margin-top:15px; background:#2a3752;" onclick="logout()">تسجيل خروج</button>
</div>

<script>
const BASE = "https://me-tp.qureo.education";
const PORTAL = "https://me-portal.qureo.education";
let isRunning = false;

function log(msg, type="info") {
    let color = type === "error" ? "#ef4444" : type === "success" ? "#10b981" : type === "header" ? "#4cc9f0" : "#a0aec0";
    let span = document.createElement("div");
    span.style.color = color;
    span.innerText = msg;
    document.getElementById("log").appendChild(span);
    document.getElementById("log").scrollTop = document.getElementById("log").scrollHeight;
}

function showError(msg) {
    let e = document.getElementById("error-msg");
    e.innerHTML = msg; e.style.display = "block";
}

function safeParse(s) {
    try { return JSON.parse(s); } catch(e) { return null; }
}

function doLogin() {
    let sid = document.getElementById("student_id").value.trim();
    let pwd = document.getElementById("password").value.trim();
    let btn = document.getElementById("login-btn");
    let btnText = document.getElementById("btn-text");
    let spinner = document.getElementById("btn-spinner");
    let err = document.getElementById("error-msg");

    if (!sid || !pwd) return showError("الرجاء إدخال رقم الطالب وكلمة المرور");
    btn.disabled = true; btnText.innerText = "جاري الدخول...";
    spinner.style.display = "block"; err.style.display = "none";
    AndroidBridge.clearCookies();

    setTimeout(() => {
        try {
            let loginResStr = AndroidBridge.request("POST", PORTAL + "/oauth2/password-login", JSON.stringify({student_id: sid, password: pwd}));
            let loginRes = safeParse(loginResStr);
            if (!loginRes) { showError("استجابة غير صالحة"); return resetBtn(btn, btnText, spinner); }

            if (loginRes.status !== 200 && loginRes.status !== 302) {
                let errBody = safeParse(loginRes.body);
                let msg = errBody && errBody.error ? errBody.error : ("HTTP " + loginRes.status);
                showError("بيانات مرفوضة: " + msg);
                return resetBtn(btn, btnText, spinner);
            }

            // تأكيد إضافة الكوكي المطلوبة بعد تسجيل الدخول
            AndroidBridge.setCookie("student_selected_content_id", "javascript_ar");

            let verifyStr = AndroidBridge.request("GET", BASE + "/api/study/students/me", null);
            let verify = safeParse(verifyStr);
            if (!verify || verify.status !== 200) {
                showError("فشل التحقق (HTTP " + (verify ? verify.status : "?") + ")");
                return resetBtn(btn, btnText, spinner);
            }

            let me = safeParse(verify.body);
            if (!me) { showError("بيانات المستخدم تالفة"); return resetBtn(btn, btnText, spinner); }
            document.getElementById("user-name").innerText = me.name || "Student";

            try {
                let dStr = AndroidBridge.request("GET", BASE + "/api/study/students/courses/javascript_ar/diamond", null);
                let d = safeParse(dStr);
                if (d && d.status === 200) {
                    let val = safeParse(d.body);
                    document.getElementById("diamonds").innerText = (typeof val === "number" || typeof val === "string") ? val : "0";
                }
            } catch(_) {}

            btnText.innerText = "تم الدخول ✅";
            setTimeout(() => {
                document.getElementById("login-screen").classList.remove("active");
                document.getElementById("dashboard").classList.add("active");
                resetBtn(btn, btnText, spinner);
            }, 400);
        } catch(e) {
            showError("خطأ: " + e.message);
            resetBtn(btn, btnText, spinner);
        }
    }, 100);
}

function resetBtn(btn, btnText, spinner) {
    btn.disabled = false; btnText.innerText = "دخول للمنصة ←"; spinner.style.display = "none";
}

async function startSolving(mode) {
    if (isRunning) return;
    isRunning = true;
    document.getElementById("start-btn").disabled = true;
    document.getElementById("cancel-btn").disabled = false;
    document.getElementById("log").innerHTML = "";
    log("🚀 بدء الحل...", "header");

    try {
        let cStr = AndroidBridge.request("GET", BASE + "/api/study/students/sections/5/chapters", null);
        let c = safeParse(cStr);
        let progressMap = {};
        if (c && c.status === 200) {
            let arr = safeParse(c.body);
            if (Array.isArray(arr)) arr.forEach(item => { if (item && item.chapter_id) progressMap[item.chapter_id] = item; });
        }

        let chapsStr = AndroidBridge.request("GET", BASE + "/api/study/sections/5", null);
        let chaps = safeParse(chapsStr);
        let qMap = {};
        if (chaps && chaps.status === 200) {
            let chObj = safeParse(chaps.body);
            if (chObj && Array.isArray(chObj.chapters)) chObj.chapters.forEach(ch => { if (ch && ch.id) qMap[ch.id] = ch.question_count || 5; });
        }

        let targets = [];
        for (let i = 1; i <= 42; i++) {
            let chapId = 90000 + i;
            let info = progressMap[chapId] || {};
            let score = info.best_correct_count || 0;
            let qCount = qMap[chapId] || 5;
            if (mode === 'perfect') { if (score < qCount) targets.push({id: chapId, num: i}); }
            else targets.push({id: chapId, num: i});
        }

        if (targets.length === 0) { log("🎉 كل المراحل مكتملة بالفعل!", "success"); return; }
        log("🚀 جاري حل " + targets.length + " مرحلة...", "header");

        for (let t of targets) {
            if (!isRunning) break;
            log("\n========== المرحلة " + t.num + " ==========", "header");
            await solveChapter(t.id);
        }
        if (isRunning) log("🎉🎉🎉 انتهى!", "success");
    } catch(e) {
        log("❌ خطأ: " + e.message, "error");
    } finally {
        isRunning = false;
        document.getElementById("start-btn").disabled = false;
        document.getElementById("cancel-btn").disabled = true;
    }
}

function cancelSolving() { isRunning = false; log("⏹️ تم إلغاء العملية.", "error"); }

async function solveChapter(chapId) {
    if (!isRunning) return;
    let rStr = AndroidBridge.request("GET", BASE + "/api/study/chapters/" + chapId, null);
    let r = safeParse(rStr);
    if (!r || r.status !== 200) { log("فشل جلب الفصل", "error"); return; }

    let data = safeParse(r.body) || {};
    let lectures = data.lectures || [];
    let testType = (data.chapter && data.chapter.test_type) || "test";

    for (let lec of lectures) {
        if (!isRunning) return;
        log("▶ بدء الدرس: " + (lec.title || lec.id), "header");
        AndroidBridge.request("PUT", BASE + "/api/study/students/lectures/" + lec.id, null);
        await sleep(200);

        let lrStr = AndroidBridge.request("GET", BASE + "/api/study/lectures/" + lec.id, null);
        let lr = safeParse(lrStr);
        if (lr && lr.status === 200) {
            let lrData = safeParse(lr.body) || {};
            for (let t of (lrData.talks || [])) {
                if (t.type === 'try') {
                    let tryData = (t.body && t.body.codes && t.body.codes[0]) || {};
                    if (tryData.model_answer) {
                        let payload = JSON.stringify({value: {try: {lang: tryData.lang || 'javascript', answer: tryData.model_answer}}});
                        AndroidBridge.request("PUT", BASE + "/api/study/students/lecture-talks/" + t.id, payload);
                        await sleep(200);
                    }
                }
            }
        }
        AndroidBridge.request("PUT", BASE + "/api/study/students/lectures/" + lec.id + "/complete", null);
        log("  ✅ تم إنهاء الدرس", "success");
        await sleep(200);
    }

    if (!isRunning) return;
    log("جلب الأسئلة...", "info");
    let qStr = AndroidBridge.request("GET", BASE + "/api/study/chapters/" + chapId + "/test", null);
    let q = safeParse(qStr);
    if (!q || q.status !== 200) { log("فشل جلب الأسئلة", "error"); return; }

    let questions = [];
    let qData = safeParse(q.body);
    if (Array.isArray(qData)) {
        for (let item of qData) {
            if (item && item.question && item.question.id) questions.push({id: item.question.id, type: item.question.type});
        }
    }
    if (questions.length === 0) { log("لا أسئلة", "error"); return; }

    await solveTwoPass(chapId, questions, testType);
}

async function solveTwoPass(chapId, questions, testType) {
    let total = questions.length;
    let prefix = testType === "test" ? "test" : "review";
    let ep = "/api/study/students/" + prefix + "-questions";

    log("🔵 PASS 1/2: إرسال إجابات مبدئية (" + total + " سؤال)...", "header");
    AndroidBridge.request("DELETE", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
    AndroidBridge.request("PUT", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
    await sleep(500);

    for (let item of questions) {
        if (!isRunning) return;
        if (item.type === "choice") {
            let dummyChoice = parseInt(item.id) * 10 + 1;
            AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/choice", JSON.stringify({choice_id: dummyChoice}));
        } else {
            AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/description", JSON.stringify({answer_code: "let _x=0;"}));
        }
        log("  Q" + item.id + " — dummy", "info");
        await sleep(200);
    }
    await sleep(1000);

    log("جلب الإجابات الصحيحة...", "info");
    let r1Str = AndroidBridge.request("GET", BASE + "/api/study/students/chapters/" + chapId + "/" + prefix + "/result", null);
    let answers = {};
    let r1 = safeParse(r1Str);
    if (r1 && r1.status === 200) {
        let rb = safeParse(r1.body) || {};
        let res = rb.result || {};
        for (let cr of (res.choice_results || [])) {
            let correct = (cr.choices || []).find(c => c.correct);
            if (cr.question_id && correct && correct.choice) answers[cr.question_id] = {choice_id: correct.choice.id};
        }
        for (let dr of (res.description_results || [])) {
            if (dr.question_id && dr.model_answer) answers[dr.question_id] = {answer_code: dr.model_answer};
        }
    }

    log("🟢 PASS 2/2: إعادة الجلسة بالإجابات الصحيحة...", "header");
    AndroidBridge.request("DELETE", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
    AndroidBridge.request("PUT", BASE + "/api/study/students/chapters/" + chapId + "/test", null);
    await sleep(500);

    for (let item of questions) {
        if (!isRunning) return;
        if (answers[item.id]) {
            let ans = answers[item.id];
            if (item.type === "choice") AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/choice", JSON.stringify(ans));
            else AndroidBridge.request("PUT", BASE + ep + "/" + item.id + "/answer/description", JSON.stringify(ans));
            log("  Q" + item.id + " ✅", "success");
        } else {
            log("  Q" + item.id + " ❌ (بدون إجابة)", "error");
        }
        await sleep(200);
    }
    await sleep(1000);

    let rfStr = AndroidBridge.request("GET", BASE + "/api/study/students/chapters/" + chapId + "/" + prefix + "/result", null);
    let rf = safeParse(rfStr);
    let score = 0;
    if (rf && rf.status === 200) {
        let rfb = safeParse(rf.body) || {};
        score = (rfb.result || {}).correct_count || 0;
    }
    log("🎉 النتيجة: " + score + "/" + total, score === total ? "success" : "error");
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function logout() { AndroidBridge.clearCookies(); location.reload(); }
</script>
</body>
</html>
